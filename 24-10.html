    <body>
        <form name="myform" onsubmit="validation()">

           </center>
           <script>
            function validation()
            {
                //let x=document.getElementById("abc").value;
                let x=document.forms["myform"]["abc"].value;

                {
                    alert(" Not a number");

                }
                
            }
           </script>
        </form>
    </body>
</html>
