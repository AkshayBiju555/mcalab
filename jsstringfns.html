<html>
    <head>
<style>
    *{
        font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }
    h3{
       color: brown; 
       text-decoration:underline;
    }
    button{
        background-color: white;
        border-radius: 3px;
        width: 275px;
    }
    button:hover {
        background-color: teal;
        color: white;
    }
    h1,h2{
        color:teal;
    }
</style>
    </head>
    <body bgcolor="beige">
        <center>
            <h1><u>JavaScript String & Math functions</u></h1>
        <h2><u>String functions</u></h2>
        Enter a string:
        <input type="text" id="t1"><br>
        <button id="b1" onclick=length()>Find Length</button><br>
        <button id="b2" onclick=toupper()>convert to  uppercase</button><br>
        <button id="b3" onclick=tolower()>convert to  lowercase</button><br>
        <button id="b4" onclick=concatenation()>concat two strings</button><br>
        <button id="b4" onclick=search()>Search word position</button><br>
        <button onclick="reverse()">Reverse String</button><br>
        <button onclick="sliceText()">Slice String</button><br>
        <button onclick="splitText()">Split String</button><br>
        <button onclick="trimText()">Trim String</button><br>
        <button onclick="replaceText()">Replace Text</button><br>
        <button onclick="substringText()">Substring</button><br>
        <button onclick="charAt()">Character at Index</button><br>

        <h3 id="a"></h3>
        <br><br><br>
        <h2><u>Math functions</u></h2>
        enter a Number
        <input type="number" id="n1"><br>
        <button id="b5" onclick=mathsq()>Find square root</button><br>
        <button id="b5" onclick=round()>Find roundoff</button><br>
        <button id="b5" onclick=ceil()>Find ceiling of the float number</button><br>
        <button id="b5" onclick=floor()>Find floor of the float number</button><br>
        <button id="b6" onclick=power()>Find power of the float number</button><br>
        <button id="b6" onclick=maxmin()>Find Maximum and minimum among the two numbers</button><br>
        <button onclick="abs()">Absolute Value</button><br>
        <button onclick="trunc()">Truncate</button><br>
        <button onclick="random()">Generate Random Number</button><br>
        <button onclick="mathConstants()">Show π and e</button><br>
        <h3 id="a1"></h3>
        <script>
            function length()
            {
               let y=document.getElementById("t1").value;
               document.getElementById("a").innerHTML="String length ="+ y.length;
            }
            function toupper()
            {
                let y=document.getElementById("t1").value;
               document.getElementById("a").innerHTML="UPPERCASE ="+ y.toUpperCase();
            }
            function tolower()
            {
                let y=document.getElementById("t1").value;
                 document.getElementById("a").innerHTML="lowercase ="+ y.toLowerCase();
            }
            function concatenation()
            {
                let x=document.getElementById("t1").value;
                let y=prompt("enter the second string");
                document.getElementById("a").innerHTML="concatenated string ="+ x+y;
           }
           function search()
           {
            let x=document.getElementById("t1").value;
            let y=prompt("enter the word to search");
            document.getElementById("a").innerHTML="word found at position ="+ x.search(y);
           }
           function reverse() {
    let str = document.getElementById("t1").value;
    let reversed = str.split("").reverse().join("");
    document.getElementById("a").innerHTML = "Reversed string = " + reversed;
}
function sliceText() {
                let str = document.getElementById("t1").value;
                let start = prompt("Enter start index:");
                let end = prompt("Enter end index:");
                document.getElementById("a").innerHTML = "Sliced string = " + str.slice(start, end);
            }
            function splitText() {
                let str = document.getElementById("t1").value;
                let sep = prompt("Enter separator (e.g., space, comma):");
                document.getElementById("a").innerHTML = "Split = " + str.split(sep);
            }

            function trimText() {
                let str = document.getElementById("t1").value;
                document.getElementById("a").innerHTML = "Trimmed = '" + str.trim() + "'";
            }
            function replaceText() {
                let str = document.getElementById("t1").value;
                let toReplace = prompt("Enter text to replace:");
                let replaceWith = prompt("Enter replacement text:");
                document.getElementById("a").innerHTML = "After replace: " + str.replace(toReplace, replaceWith);
            }

            function substringText() {
                let str = document.getElementById("t1").value;
                let start = prompt("Enter start index:");
                let end = prompt("Enter end index:");
                document.getElementById("a").innerHTML = "Substring = " + str.substring(start, end);
            }
            function charAt() {
                let str = document.getElementById("t1").value;
                let index = prompt("Enter index:");
                document.getElementById("a").innerHTML = "Character at index " + index + " = " + str.charAt(index);
            }
           function mathsq()
           {
            let x=parseFloat(document.getElementById("n1").value);
            document.getElementById("a1").innerHTML="square root= "+ Math.sqrt(x);
            
           }
           function round()
           {
            let x=parseFloat(document.getElementById("n1").value);
            document.getElementById("a1").innerHTML="roundoff= "+ Math.round(x);
           }
           function ceil()
           {
            let x=parseFloat(document.getElementById("n1").value);
            document.getElementById("a1").innerHTML="ceiling of float= "+ Math.ceil(x);
           }
           function floor()
           {
            let x=parseFloat(document.getElementById("n1").value);
            document.getElementById("a1").innerHTML="ceiling of float= "+ Math.floor(x);
           }
           function power()
           {
            let x=parseFloat(document.getElementById("n1").value);
            let y=prompt("enter the power");
            document.getElementById("a1").innerHTML="power= "+ Math.pow(x,y);
           } 
           function maxmin()
           {
            let x=parseFloat(document.getElementById("n1").value);
            let y=prompt("enter the second number");
            document.getElementById("a1").innerHTML="MAX= "+ Math.max(x,y) + "MIN= "+ Math.min(x,y);
           }
           function abs() {
                let x = parseFloat(document.getElementById("n1").value);
                document.getElementById("a1").innerHTML = "Absolute = " + Math.abs(x);
            }

            function trunc() {
                let x = parseFloat(document.getElementById("n1").value);
                document.getElementById("a1").innerHTML = "Truncated = " + Math.trunc(x);
            }

            function random() {
                let rand = Math.random();
                document.getElementById("a1").innerHTML = "Random number (0–1) = " + rand;
            }

            function mathConstants() {
                document.getElementById("a1").innerHTML = "PI = " + Math.PI + ", e = " + Math.E;
            }
        </script>
        
       </center>
    </body>
</html>
