<html>
    <head>
        <style>
            h1,h2,p
            {
                color:cyan;
            }
            *
            {
                font-style: italic;
                color:red;
            }
        </style>
    </head>
    <body bgcolor="black">
        <h1>group selector</h1>
        <h2>for h1,h2,p</h2>
        <p>is shown using commas to seperate the tags given in the style tag</p>
    </body>
</html>
