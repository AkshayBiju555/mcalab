<!DOCTYPE html>
<html>
<head>
    <style>
    *{
        text-align: center;
    }
    #image {
      width: 500px;
      height: 500px;
    }
    </style>
  <title>image , text chsange</title>
</head>
<body>

<img id="image" src="123.jpg" alt="Original Image" onmouseover="hoverIn()" onmouseout="hoverOut()">
<p id="text">Original text</p>

<script>
  const image = document.getElementById('image');
  const text = document.getElementById('text');

  function hoverIn() 
  {
    image.src='cs.jpg';
    text.textContent='onmouseover.';
  }

  function hoverOut() 
  {
    image.src='as.png';
    text.textContent='onmouseout.';
  }
</script>

</body>
</html>
