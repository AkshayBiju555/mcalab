<html>
    <head>
        <title>form example</title>

    </head>
    <body>
        <form>
            <table>
                <tr>
                    <td>Name</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td><input type="radio" name="M">Male
                        <input type="radio" name="M">Fem
                    </td>
                </tr>
                <tr>
                    <td>Address</td>
                    <td><textarea hint="enter address"></textarea></td>
                </tr>
                <tr>
                    <td>password</td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td>select a file</td>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td>select a language</td>
                    <td><input type="checkbox" name="N">Malayalam
                    <input type="checkbox" name="N">Hindi
                <input type="checkbox" name="N">English</td>
                </tr>
                <tr>
                    <td><button value="submit">Submit</button></td>
                    <td><input type="reset" value="reset"></td>
                </tr>
            </table>
        </form>
    </body>
</html>
